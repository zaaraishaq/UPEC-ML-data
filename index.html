<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPEC Genomic Database (UPEC-GDB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="UPEC_Metadata_Complete.js"></script>
    <script src="Pakistani_Isolates.js" defer></script>
    <script src="model_performance_results.js" defer></script>
    <script src="Table_SHAP_Mean_Absolute_Values.js" defer></script>
    <script src="Table_Feature_Prevalence_Percentages.js" defer></script>

    <script>
        // ... (Keep your existing Tailwind config and CSS here) ...
    </script>
</head>
<body>
    <script>
        // Utility to ensure data keys match the expected internal schema
        function standardizeDataKeys(data) {
            if (!data) return data;
            if (Array.isArray(data)) return data.map(standardizeDataKeys);
            if (typeof data === 'object' && data !== null) {
                const newObj = {};
                for (const key in data) {
                    const cleanKey = key.replace(/\s+/g, '_');
                    newObj[cleanKey] = standardizeDataKeys(data[key]);
                }
                return newObj;
            }
            return data;
        }

        window.onload = function() {
            // Assigning data from loaded scripts to local variables
            const rawMetadata = window.UPEC_Metadata_Complete || [];
            const rawPakistani = window.Pakistani_Isolates || [];
            const rawPerformance = window.model_performance_results || [];
            const rawSHAP = window.Table_SHAP_Mean_Absolute_Values || [];
            const rawPrevalence = window.Table_Feature_Prevalence_Percentages || [];

            // Standardize keys (e.g., "Size (Mb)" -> "Size_(Mb)")
            mainDb = standardizeDataKeys(rawMetadata);
            // If you need to combine or select datasets, do it here:
            // mainDb = [...mainDb, ...standardizeDataKeys(rawPakistani)];

            console.log("Database initialized with", mainDb.length, "entries.");

            // Initialize your chart modules and table rendering
            applyFilters(); 
            initializePerformanceModule(standardizeDataKeys(rawPerformance));
            initializeSHAPModule(standardizeDataKeys(rawSHAP));
            initializePrevalenceModule(standardizeDataKeys(rawPrevalence));
        };
    </script>
</body>
</html>
